<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SORA — Medical AI · Alexandria National University</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root {
  --sky-0: #FFFFFF;
  --sky-1: #F0F7FF;
  --sky-2: #DAEEFF;
  --sky-3: #B4D9FF;
  --sky-4: #78B8FF;
  --sky-5: #3D8EE8;
  --sky-6: #1A5FBF;
  --sun-1: #FFF8E8;
  --sun-2: #FFE9A0;
  --sun-3: #FFD24D;
  --sun-4: #F5A623;
  --lavender-1: #F3EFFF;
  --lavender-2: #D8CCFF;
  --lavender-3: #A78FE8;
  --med-green:   #e8f5e9;
  --med-green-2: #43a047;
  --cloud: rgba(255,255,255,0.92);
  --text-primary:   #1C2B3A;
  --text-secondary: #4A6080;
  --text-muted:     #8BA3BF;
  --border:       rgba(100,160,220,0.18);
  --border-hover: rgba(61,142,232,0.35);
  --shadow-sm: 0 2px 12px rgba(61,100,180,0.07);
  --shadow-md: 0 6px 28px rgba(61,100,180,0.11);
  --shadow-lg: 0 16px 56px rgba(61,100,180,0.16);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; height: 100%; }

body {
  background: var(--sky-1);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ─── BACKGROUND ─── */
.sky-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 100% 60% at 50% -10%, rgba(120,184,255,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 20%, rgba(167,143,232,0.10) 0%, transparent 60%),
    linear-gradient(180deg, #F0F7FF 0%, #FAFCFF 60%, #F5F0FF 100%);
  pointer-events: none;
}

/* ─── NAV ─── */
nav {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 1.5rem;
  background: rgba(240,247,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.nav-brand { display:flex; align-items:center; gap:0.65rem; text-decoration:none; }
.nav-wordmark { font-family:'Outfit',sans-serif; font-size:1.35rem; font-weight:800; color:var(--sky-6); letter-spacing:0.08em; }
.nav-tagline  { font-size:0.72rem; color:var(--text-muted); letter-spacing:0.04em; }
.nav-right { display:flex; align-items:center; gap:0.6rem; }

.btn-ghost {
  background: transparent;
  border: 1.5px solid var(--border-hover);
  color: var(--sky-6);
  padding: 0.38rem 0.9rem; border-radius: 100px;
  font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:500;
  cursor: pointer; transition: all 0.2s;
}
.btn-ghost:hover { background:var(--sky-2); border-color:var(--sky-5); }

/* ─── MAIN LAYOUT ─── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  overflow: hidden;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  padding: 1rem 1rem calc(0.5rem + var(--safe-bottom));
}

/* ─── API KEY SECTION ─── */
.api-setup {
  background: white;
  border: 1px solid #FDE68A;
  border-radius: 16px;
  padding: 1rem 1.25rem;
  margin-bottom: 0.85rem;
  flex-shrink: 0;
}
.api-setup-notice {
  font-size: 0.82rem; color: #92400E; margin-bottom: 0.75rem; line-height: 1.6;
}
.api-setup-notice a { color: var(--sun-4); font-weight: 600; }
.api-key-group { display:flex; gap:0.5rem; }
.api-key-group input {
  flex:1; font-family:'DM Mono', 'Courier New', monospace;
  background: var(--sky-1); border: 1.5px solid var(--border);
  color: var(--text-primary); border-radius: 10px;
  padding: 0.6rem 0.9rem; font-size: 0.85rem;
  transition: border-color 0.2s; outline: none;
}
.api-key-group input:focus { border-color: var(--sky-4); background: white; }
.btn-save-key {
  background: linear-gradient(135deg, #F5A623, #E68900);
  border: none; color: white; border-radius: 10px;
  padding: 0.6rem 1rem; font-size: 0.85rem; cursor: pointer;
  white-space: nowrap; font-family: 'DM Sans', sans-serif;
  font-weight: 600; transition: opacity 0.2s;
}
.btn-save-key:hover { opacity: 0.9; }

/* ─── ERROR BANNER ─── */
.error-banner {
  background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 12px;
  padding: 0.7rem 1rem; font-size: 0.82rem; color: #991B1B;
  margin-bottom: 0.75rem; display: none; line-height: 1.5; flex-shrink: 0;
}
.error-banner.visible { display: block; }

/* ─── CHAT WINDOW ─── */
.chat-window {
  flex: 1;
  background: white;
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.chat-header {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.85rem 1.25rem;
  background: linear-gradient(135deg, var(--sky-1), var(--lavender-1));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-header-info h3 { font-family:'Outfit',sans-serif; font-size:0.92rem; font-weight:700; color:var(--text-primary); }
.chat-header-info p  { font-size:0.72rem; color:var(--sky-5); font-weight:500; }

.online-dot {
  width: 8px; height: 8px; background: #34D399; border-radius: 50%;
  box-shadow: 0 0 0 2px white, 0 0 0 4px rgba(52,211,153,0.25);
  flex-shrink: 0;
  transition: background 0.3s;
}

/* ─── MESSAGES ─── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  background: var(--sky-1);
  scroll-behavior: smooth;
  overscroll-behavior: contain;
  min-height: 0;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--sky-3); border-radius: 10px; }

.msg {
  display: flex; gap: 0.6rem; align-items: flex-start;
  animation: msgIn 0.3s ease forwards; opacity: 0;
}
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.sora-avatar-wrap {
  background: linear-gradient(135deg, var(--sky-2), var(--lavender-1));
  border: 1.5px solid var(--sky-3);
  font-size: 1rem;
}
.user-msg-avatar {
  background: linear-gradient(135deg, var(--sky-5), var(--sky-6));
  font-size: 0.72rem; font-weight: 700; color: white;
  border: none;
}

.msg-bubble {
  max-width: 78%; padding: 0.8rem 1rem;
  border-radius: 18px; line-height: 1.7; font-size: 0.875rem;
  word-break: break-word; overflow-wrap: break-word;
}
.msg.sora .msg-bubble {
  background: white; border: 1px solid var(--border); color: var(--text-primary);
  border-top-left-radius: 6px; box-shadow: var(--shadow-sm);
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--sky-5), var(--sky-6));
  color: white; border-top-right-radius: 6px;
}

.msg-image-preview {
  max-width: 200px; border-radius: 10px; margin-bottom: 0.5rem;
  display: block; border: 1px solid rgba(255,255,255,0.3);
}

/* ─── TYPING INDICATOR ─── */
.typing-dots {
  display: flex; gap: 5px; padding: 0.6rem 0.85rem;
  background: white; border: 1px solid var(--border);
  border-radius: 18px; border-top-left-radius: 6px;
  box-shadow: var(--shadow-sm);
}
.typing-dots span {
  width: 7px; height: 7px; background: var(--sky-4); border-radius: 50%;
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ─── INPUT AREA ─── */
.chat-input-area {
  padding: 0.75rem 1rem 0.85rem;
  border-top: 1px solid var(--border);
  background: white;
  flex-shrink: 0;
}

.quick-actions {
  display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem;
}
.quick-btn {
  background: var(--sky-1); border: 1px solid var(--sky-3); color: var(--sky-6);
  border-radius: 100px; padding: 0.3rem 0.75rem;
  font-size: 0.76rem; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-weight: 500;
  transition: all 0.15s; white-space: nowrap;
}
.quick-btn:hover { background: var(--sky-2); border-color: var(--sky-4); }

/* Preview bars */
.pdf-preview-bar,
.img-preview-bar {
  display: none; align-items: center; gap: 0.5rem;
  padding: 0.35rem 0.6rem; border-radius: 8px;
  margin-bottom: 0.5rem; font-size: 0.76rem;
}
.pdf-preview-bar { background: #FFF8E8; border: 1px solid #FDE68A; color: #92400E; }
.img-preview-bar { background: var(--sky-1); border: 1px solid var(--sky-3); color: var(--sky-6); }
.img-preview-bar img { height: 32px; border-radius: 6px; object-fit: cover; }
.pdf-preview-bar.active, .img-preview-bar.active { display: flex; }
.btn-clear-attach {
  margin-left: auto; background: none; border: none; cursor: pointer;
  font-size: 0.9rem; line-height: 1; opacity: 0.55; padding: 0 0.15rem;
}
.btn-clear-attach:hover { opacity: 1; color: #EF4444; }

.input-row { display: flex; gap: 0.5rem; align-items: flex-end; }

/* Upload buttons */
.btn-attach {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--sky-1); border: 1.5px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0; color: var(--sky-5); position: relative;
}
.btn-attach:hover { background: var(--sky-2); border-color: var(--sky-4); }
.btn-attach.pdf { background: #FFF8E8; border-color: #FDE68A; color: #92400E; }
.btn-attach.pdf:hover { background: #FEF3C7; border-color: var(--sun-4); }
.btn-attach.pdf.active { background: #FFF3E0; border-color: var(--sun-4); color: #E65100; }
.btn-attach input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}

.chat-textarea {
  flex: 1; background: var(--sky-1); border: 1.5px solid var(--border);
  color: var(--text-primary); border-radius: 14px;
  padding: 0.65rem 0.9rem; font-size: 0.875rem;
  font-family: 'DM Sans', sans-serif;
  resize: none; min-height: 42px; max-height: 160px;
  transition: border-color 0.2s; outline: none; line-height: 1.5;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.chat-textarea:focus { border-color: var(--sky-4); background: white; }
.chat-textarea::placeholder { color: var(--text-muted); }

.btn-send {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sky-5), var(--sky-6));
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(61,142,232,0.35);
  transition: all 0.25s; flex-shrink: 0;
  color: white;
}
.btn-send:not(:disabled):hover {
  transform: scale(1.08); box-shadow: 0 6px 24px rgba(61,142,232,0.5);
}
.btn-send:disabled { opacity: 0.38; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-send.sending { animation: pulseSend 0.9s ease-in-out infinite; }

/* ─── MSG ACTIONS ─── */
.msg-actions {
  margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem;
  align-items: center; border-top: 1px solid var(--border); padding-top: 0.45rem;
}
.btn-copy {
  display: inline-flex; align-items: center; gap: 0.25rem;
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 8px; padding: 0.22rem 0.55rem; font-size: 0.7rem;
  cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
}
.btn-copy:hover { background: var(--sky-1); border-color: var(--sky-4); color: var(--sky-6); }
.btn-copy.copied { border-color: #A7F3D0; color: #065F46; background: #F0FDF9; }

.btn-pdf-dl {
  display: inline-flex; align-items: center; gap: 0.35rem;
  background: linear-gradient(135deg, #e53935, #b71c1c);
  color: white; border: none; border-radius: 100px;
  padding: 0.28rem 0.8rem; font-size: 0.72rem; font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  box-shadow: 0 2px 10px rgba(229,57,53,0.3); transition: all 0.2s;
}
.btn-pdf-dl:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(229,57,53,0.4); }

/* ─── MARKDOWN ─── */
.msg-bubble p { margin: 0.25rem 0; }
.msg-bubble p:first-child { margin-top: 0; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble ul, .msg-bubble ol { padding-left: 1.25rem; margin: 0.25rem 0; }
.msg-bubble li { margin: 0.15rem 0; }
.msg-bubble em { font-style: italic; opacity: 0.85; }
.msg-bubble strong { font-weight: 700; }
.msg.sora .msg-bubble strong { color: var(--text-primary); }
.msg.user .msg-bubble strong { color: rgba(255,255,255,0.95); }
.msg-bubble h1 { font-family:'Outfit',sans-serif; font-size:1.1rem; font-weight:800; color:var(--sky-6); margin:0.7rem 0 0.25rem; padding-bottom:0.3rem; border-bottom:2px solid var(--sky-2); }
.msg-bubble h2 { font-family:'Outfit',sans-serif; font-size:0.97rem; font-weight:700; color:var(--sky-6); margin:0.6rem 0 0.2rem; }
.msg-bubble h3 { font-family:'Outfit',sans-serif; font-size:0.88rem; font-weight:600; color:var(--text-primary); margin:0.45rem 0 0.12rem; }
.msg-bubble h4 { font-family:'Outfit',sans-serif; font-weight:700; font-size:0.85rem; margin:0.4rem 0 0.1rem; color:var(--sky-6); }
.msg-bubble code { background:var(--sky-1); color:var(--sky-6); padding:0.1rem 0.3rem; border-radius:4px; font-size:0.8rem; font-family:'Courier New',monospace; }
.msg-bubble hr { border:none; border-top:1px solid var(--border); margin:0.5rem 0; }
.msg-bubble a { color:var(--sky-5); }
.msg-bubble table { border-collapse:collapse; width:100%; font-size:0.78rem; margin:0.4rem 0; border-radius:8px; overflow:hidden; }
.msg-bubble th { background:var(--sky-2); color:var(--sky-6); padding:0.3rem 0.55rem; text-align:left; }
.msg-bubble td { border-bottom:1px solid var(--border); padding:0.25rem 0.55rem; }
.msg-bubble tr:last-child td { border-bottom:none; }

/* ─── PDF label inside user bubble ─── */
.pdf-label-in-msg {
  display: inline-flex; align-items: center; gap: 0.3rem;
  background: rgba(255,255,255,0.2); border-radius: 7px;
  padding: 0.25rem 0.5rem; font-size: 0.76rem; margin-bottom: 0.35rem;
}

/* ─── TOAST ─── */
.toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
  background: white; border: 1px solid var(--border);
  border-radius: 12px; padding: 0.7rem 1.1rem;
  font-size: 0.83rem; color: var(--text-primary);
  box-shadow: var(--shadow-lg);
  transform: translateY(60px); opacity: 0;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
  max-width: 260px; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.toast.success { border-color: #A7F3D0; background: #F0FDF9; color: #065F46; }
.toast.error   { border-color: #FCA5A5; background: #FEF2F2; color: #991B1B; }

/* ─── ANIMATIONS ─── */
@keyframes msgIn        { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes typingBounce { 0%,60%,100% { transform:translateY(0); opacity:0.5; } 30% { transform:translateY(-5px); opacity:1; } }
@keyframes pulseSend    { 0%,100% { box-shadow:0 4px 16px rgba(61,142,232,0.35); } 50% { box-shadow:0 6px 24px rgba(61,142,232,0.6); } }
@keyframes breathe      { 0%,100% { r:8; opacity:0.9; } 50% { r:11; opacity:0.6; } }
@keyframes spinRay      { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
@keyframes orbiting     { from { transform:rotate(0deg) translateX(24px) rotate(0deg); } to { transform:rotate(360deg) translateX(24px) rotate(-360deg); } }
@keyframes orbiting2    { from { transform:rotate(120deg) translateX(24px) rotate(-120deg); } to { transform:rotate(480deg) translateX(24px) rotate(-480deg); } }
@keyframes orbiting3    { from { transform:rotate(240deg) translateX(24px) rotate(-240deg); } to { transform:rotate(600deg) translateX(24px) rotate(-600deg); } }
@keyframes orbitSmall   { from { transform:rotate(60deg) translateX(14px) rotate(-60deg); } to { transform:rotate(420deg) translateX(14px) rotate(-420deg); } }
@keyframes orbitSmall2  { from { transform:rotate(180deg) translateX(14px) rotate(-180deg); } to { transform:rotate(540deg) translateX(14px) rotate(-540deg); } }
@keyframes drawCircle   { to { stroke-dashoffset:0; } }

/* ─── MOBILE ─── */
@media (max-width: 600px) {
  body { overflow: hidden; }
  main { padding: 0.5rem 0 0; }
  .chat-window {
    border-radius: 16px 16px 0 0;
    border-left: none; border-right: none; border-bottom: none;
    box-shadow: none;
  }
  .api-setup { border-radius: 12px; margin: 0 0.5rem 0.5rem; }
  .error-banner { margin: 0 0.5rem 0.5rem; }
  .msg-bubble { max-width: 88%; font-size: 0.88rem; }
  .quick-btn { font-size: 0.72rem; padding: 0.27rem 0.65rem; }
  .chat-textarea { font-size: 16px; } /* prevent iOS auto-zoom */
  .toast { bottom: 0.75rem; right: 0.75rem; left: 0.75rem; max-width: none; text-align: center; }
  nav { padding: 0.65rem 1rem; }
  .nav-tagline { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="sky-bg"></div>

<!-- NAV -->
<nav>
  <a href="#" class="nav-brand">
    <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" width="30" height="30">
      <defs>
        <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFD24D"/>
          <stop offset="100%" stop-color="#78B8FF"/>
        </linearGradient>
      </defs>
      <circle cx="17" cy="17" r="15" stroke="#3D8EE8" stroke-width="1.2" fill="none" opacity="0.5"/>
      <circle cx="17" cy="17" r="5" fill="url(#navGrad)"/>
      <line x1="17" y1="4"  x2="17" y2="8"  stroke="#FFD24D" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="17" y1="26" x2="17" y2="30" stroke="#FFD24D" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="4"  y1="17" x2="8"  y2="17" stroke="#FFD24D" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="26" y1="17" x2="30" y2="17" stroke="#FFD24D" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <g style="transform-origin:17px 17px;animation:spinRay 12s linear infinite;">
        <circle cx="17" cy="5" r="1.8" fill="#3D8EE8"/>
      </g>
    </svg>
    <div>
      <div class="nav-wordmark">SORA</div>
      <div class="nav-tagline">空 · Medical AI · ANU</div>
    </div>
  </a>
  <div class="nav-right">
    <button class="btn-ghost" onclick="clearChat()" title="New conversation">New Chat</button>
    <div class="online-dot" id="online-dot"></div>
  </div>
</nav>

<!-- MAIN -->
<main>
  <!-- API Key Setup -->
  <div id="api-setup" style="display:none;">
    <div class="api-setup">
      <div class="api-setup-notice">
        ✦ SORA uses <strong>Google Gemini</strong> (free). Get your key at
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com ↗</a>
        — saved locally in your browser only.
      </div>
      <div class="api-key-group">
        <input type="password" id="api-key-input" placeholder="Paste your Gemini API key…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="btn-save-key" onclick="saveApiKey()">Save ✦</button>
      </div>
    </div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="error-banner"></div>

  <!-- Chat window -->
  <div class="chat-window">
    <div class="chat-header">
      <!-- SORA sigil -->

/* ═══════════════════════════════════════
   MARKDOWN RENDERER
═══════════════════════════════════════ */
function mdToHtml(text) {
  // Escape HTML
  let h = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Headings (process longest first to avoid partial matches)
  h = h.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  h = h.replace(/^#####\s+(.+)$/gm,  '<h5>$1</h5>');
  h = h.replace(/^####\s+(.+)$/gm,   '<h4>$1</h4>');
  h = h.replace(/^###\s+(.+)$/gm,    '<h3>$1</h3>');
  h = h.replace(/^##\s+(.+)$/gm,     '<h2>$1</h2>');
  h = h.replace(/^#\s+(.+)$/gm,      '<h1>$1</h1>');

  // HR
  h = h.replace(/^---+$/gm, '<hr>');

  // Tables
  h = h.replace(/((?:^(?:\|[^\n]+\|)\n?)+)/gm, block => {
    const rows = block.trim().split('\n');
    let out = '<table>'; let headerDone = false;
    for (const row of rows) {
      if (/^\|[\s\-:|]+\|$/.test(row)) { headerDone = true; continue; }
      const cells = row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      if (!headerDone) {
        out += '<thead><tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      } else {
        out += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
      }
    }
    if (!headerDone) out += '<tbody>';
    out += '</tbody></table>';
    return out;
  });

  // Numbered lists
  h = h.replace(/((?:^\d+\.\s+.+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\.\s+/, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Bullet lists
  h = h.replace(/((?:^[•\-\*]\s+.+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[•\-\*]\s+/, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Bold + italic, bold, italic
  h = h.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g,     '<strong>$1</strong>');
  h = h.replace(/\*([^*\n]+)\*/g,          '<em>$1</em>');

  // Inline code
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Links
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Paragraphs — split on double newlines
  const blocks = h.split(/\n{2,}/);
  h = blocks.map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<(h[1-6]|ul|ol|hr|table)/.test(b)) return b;
    b = b.replace(/\n/g, '<br>');
    return `<p>${b}</p>`;
  }).filter(Boolean).join('');

  return h;
}

/* ═══════════════════════════════════════

    <circle cx="36" cy="36" r="9" fill="#FFD24D"

    <g style="transform-origin:36px 36px;animation:spinRay 18s linear infinite;">
      <line x1="36" y1="8"  x2="36" y2="14" stroke="#FFD24D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="36" y1="58" x2="36" y2="64" stroke="#FFD24D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="8"  y1="36" x2="14" y2="36" stroke="#FFD24D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="58" y1="36" x2="64" y2="36" stroke="#FFD24D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <g style="transform-origin:36px 36px;animation:orbiting 3.5s linear infinite;">

function addSoraMsg(text, showPdfBtn) {
  const msgs = document.getElementById('messages');
  if (!msgs) return;

  const key = 'k' + (++_storeIdx);

  const wrapper = document.createElement('div');

  const rendered = mdToHtml(text);
  const pdfBtnHtml = showPdfBtn
    ? `<button class="btn-pdf-dl" onclick="generatePDF('${key}')">📄 Download PDF</button>`
    : '';

  wrapper.innerHTML = `
    <div class="msg-avatar sora-avatar-wrap">${soraAvatarSVG()}</div>

      ${rendered}

        <button class="btn-copy" onclick="copyText('${key}', this)">⎘ Copy</button>
      </div>

function addUserMsg(text, imgDataUrl, pdfName) {
  const msgs = document.getElementById('messages');
  if (!msgs) return;

  let inner = '';
  if (imgDataUrl) {
    inner += `<img class="msg-image-preview" src="${imgDataUrl}" alt="Attached image">`;
  }
  if (pdfName) {
    const safe = pdfName.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    inner += `<div class="pdf-label-in-msg">📄 ${safe}</div>`;
  }
  if (text) {
    inner += text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'msg user';
  wrapper.innerHTML = `
    <div class="msg-avatar user-msg-avatar">S</div>
    <div class="msg-bubble">${inner}</div>`;

let _typingEl = null;
function showTyping() {
  if (_typingEl) return;
  const msgs = document.getElementById('messages');
  if (!msgs) return;
  _typingEl = document.createElement('div');
  _typingEl.className = 'msg sora';
  _typingEl.innerHTML = `
    <div class="msg-avatar sora-avatar-wrap" style="font-size:1rem;display:flex;align-items:center;justify-content:center;">🩺</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;

function hideTyping() {

}

/* ═══════════════════════════════════════
   IMAGE / PDF HANDLING
═══════════════════════════════════════ */
window.handleImageSelect = function (input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { showToast('Image too large (max 10 MB)', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const [meta, b64] = dataUrl.split(',');
    _imgBase64 = b64;
    _imgMime   = meta.match(/:(.*?);/)[1];
    document.getElementById('img-preview-thumb').src = dataUrl;
    document.getElementById('img-preview-name').textContent = file.name;
    document.getElementById('img-preview-bar').classList.add('active');
    updateSendBtn();
    showToast('Image attached ✦', 'success');
  };
  reader.readAsDataURL(file);
};

window.clearImage = function () {
  _imgBase64 = null; _imgMime = null;
  document.getElementById('img-input').value = '';
  document.getElementById('img-preview-bar').classList.remove('active');
  updateSendBtn();
};

window.handlePDFSelect = function (input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { showToast('PDF too large (max 20 MB)', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    _pdfBase64 = e.target.result.split(',')[1];
    _pdfName   = file.name;
    document.getElementById('pdf-preview-name').textContent = file.name;
    document.getElementById('pdf-preview-bar').classList.add('active');
    document.getElementById('pdf-btn-label').classList.add('active');
    updateSendBtn();
    showToast('PDF attached ✦', 'success');
  };
  reader.readAsDataURL(file);
};

window.clearPDF = function () {
  _pdfBase64 = null; _pdfName = null;
  document.getElementById('pdf-input').value = '';
  document.getElementById('pdf-preview-bar').classList.remove('active');
  document.getElementById('pdf-btn-label').classList.remove('active');
  updateSendBtn();
};

/* ═══════════════════════════════════════
   SEND MESSAGE  (Gemini REST API)
═══════════════════════════════════════ */
window.sendMessage = async function () {
  const inputEl = document.getElementById('chat-input');
  const text    = (inputEl.value || '').trim();
  const hasImg  = !!_imgBase64;
  const hasPDF  = !!_pdfBase64;

  if ((!text && !hasImg && !hasPDF) || isSending) return;

  // Key management shortcut
  if (text && /\b(api\s*key|gemini\s*key|set\s*(my\s*)?key|change\s*(my\s*)?key|update\s*(my\s*)?key|new\s*key)\b/i.test(text)) {
    inputEl.value = ''; autoResize(inputEl); updateSendBtn();
    addUserMsg(text);
    document.getElementById('api-setup').style.display = 'block';
    addSoraMsg('Paste your new Gemini API key in the field above and press **Save**.', false);
    return;
  }

  const apiKey = localStorage.getItem('sora_gemini_key');
  if (!apiKey) { promptForKey('missing'); return; }

  // Lock UI
  isSending = true;
  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  sendBtn.classList.add('sending');
  hideErrorBanner();

  // Capture and clear attachments
  const imgB64   = _imgBase64;
  const imgMime  = _imgMime;
  const pdfB64   = _pdfBase64;
  const pdfName  = _pdfName;
  const imgThumb = hasImg ? document.getElementById('img-preview-thumb').src : null;

  inputEl.value = ''; autoResize(inputEl); updateSendBtn();
  if (hasImg) clearImage();
  if (hasPDF) clearPDF();

  // Show user message
  addUserMsg(text, imgThumb, pdfName);
  showTyping();

  // Build parts for this turn
  const userParts = [];
  if (hasImg && imgB64) userParts.push({ inline_data: { mime_type: imgMime, data: imgB64 } });
  if (hasPDF && pdfB64) userParts.push({ inline_data: { mime_type: 'application/pdf', data: pdfB64 } });

  const userText = text
    || (hasImg ? 'Analyze this medical image in the context of the ANU curriculum. Describe what you observe and its clinical relevance.'
               : `Analyze this PDF (${pdfName || 'document.pdf'}) and provide a structured summary of its key medical content.`);
  userParts.push({ text: userText });

  // Append to history
  conversationHistory.push({ role: 'user', parts: userParts });

  // Gemini REST payload
  const systemPrompt = buildSystemPrompt();
  const payload = {
    system_instruction: { parts: [{ text: systemPrompt }] },
    contents: conversationHistory,
    generationConfig: {
      temperature: 0.4,
      maxOutputTokens: 8192,
      topP: 0.9
    }
  };

  // Try models in order
  const MODELS = [
    'gemini-2.0-flash',
    'gemini-1.5-flash',
    'gemini-1.5-flash-8b'
  ];

  let replyText = null;
  let lastErr   = '';

  for (const model of MODELS) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      // Auth errors → stop immediately
      if (res.status === 400 || res.status === 401 || res.status === 403) {
        const errMsg = data?.error?.message || `HTTP ${res.status}`;
        const isAuthErr = /API_KEY|api.key|invalid|401|403|PERMISSION_DENIED/i.test(errMsg + res.status);
        if (isAuthErr) {
          hideTyping(); finalizeSend(sendBtn);
          conversationHistory.pop();
          promptForKey('invalid');
          return;
        }
        lastErr = errMsg;
        continue; // try next model
      }

      if (!res.ok) { lastErr = data?.error?.message || `HTTP ${res.status}`; continue; }

      // Extract text from response
      const candidate = data?.candidates?.[0];
      if (!candidate) { lastErr = 'No candidates in response'; continue; }

      // Check finish reason for safety blocks
      if (candidate.finishReason === 'SAFETY') {
        replyText = 'Response blocked by safety filters. Please rephrase your question.';
        break;
      }

      const parts = candidate?.content?.parts || [];
      const extracted = parts.map(p => p.text || '').join('').trim();
      if (extracted) { replyText = extracted; break; }
      lastErr = 'Empty response from model';
    } catch (err) {
      lastErr = err.message || String(err);
      // Network error — try next model
      continue;
    }
  }

  hideTyping();

  if (!replyText) {
    conversationHistory.pop(); // rollback
    showErrorBanner(`<strong>Error:</strong> ${escHtml(lastErr)}. Check your API key or try again.`);
  } else {
    conversationHistory.push({ role: 'model', parts: [{ text: replyText }] });
    const isPdfRequest = /\b(summary|summarize|summarise|pdf|download|export|outline)\b/i.test(text);
    const showPdf = isPdfRequest || replyText.length > 500;
    addSoraMsg(replyText, showPdf);
    if (conversationHistory.length >= 2) {
      document.getElementById('quick-actions').style.display = 'none';
    }
  }

  finalizeSend(sendBtn);
};

function finalizeSend(sendBtn) {
  isSending = false;
  sendBtn.classList.remove('sending');
  updateSendBtn();
  try { document.getElementById('chat-input').focus(); } catch(e) {}
}

function buildSystemPrompt() {
  const today = new Date().toLocaleDateString('en-GB', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  return `You are SORA, a precise medical AI assistant for Alexandria National University (ANU) Medical School students.

PERSONALITY:
- Direct and efficient. No greetings, no filler, no hollow encouragement.
- Answer immediately. Never say "Great question!" or "I'd be happy to help". Just answer.
- Use structured markdown: headings (#, ##, ###), bullets, numbered lists when appropriate.

PURPOSE:
- Answer curriculum questions at MBBS level.
- Generate well-structured topic summaries using rich markdown.
- Analyze medical images (histology, X-ray, ECG, microscopy, diagrams).
- Read and summarize PDF documents.
- Ground all answers in evidence-based medicine at MBBS/medical student level.

CURRICULUM CONTEXT — ANU 6-year MBBS:
- Years 1-2 (Basic Sciences): Anatomy, Histology, Embryology, Physiology, Biochemistry
- Year 3 (Pre-clinical): Pathology, Pharmacology, Microbiology, Parasitology, Forensic Medicine
- Years 4-6 (Clinical): Internal Medicine, Surgery, Pediatrics, Obstetrics & Gynecology, Psychiatry, Community Medicine, ENT, Ophthalmology, Dermatology

SUMMARY FORMAT (when asked to summarize a topic):
# Topic Title
## Definition/Overview
## Etiology / Classification
## Pathophysiology
## Clinical Features
## Investigations
## Management
## Key Points

Use **bold** for key terms. Be comprehensive but focused.

Today: ${today}.`;
}

/* ═══════════════════════════════════════
   QUICK SEND
═══════════════════════════════════════ */
window.sendQuick = function (text) {
  const input = document.getElementById('chat-input');
  input.value = text;
  autoResize(input);
  updateSendBtn();
  sendMessage();
};

/* ═══════════════════════════════════════
   INPUT HANDLERS
═══════════════════════════════════════ */
window.handleKey = function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

window.autoResize = function (el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
};

window.updateSendBtn = function () {
  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('send-btn');
  if (!btn) return;
  btn.disabled = !(
    (input && input.value.trim()) || _imgBase64 || _pdfBase64
  ) || isSending;
};

/* ═══════════════════════════════════════
   COPY
═══════════════════════════════════════ */
window.copyText = function (key, btn) {
  const text = _textStore[key] || '';
  const finish = () => {
    btn.classList.add('copied');
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '⎘ Copy'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, btn, finish));
  } else {
    fallbackCopy(text, btn, finish);
  }
};

function fallbackCopy(text, btn, finish) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); finish(); }
  catch(e) { showToast('Copy not supported in this browser', 'error'); }
  document.body.removeChild(ta);
}

/* ═══════════════════════════════════════
   PDF GENERATION
═══════════════════════════════════════ */
window.generatePDF = function (storeKey) {
  const mdText = _textStore[storeKey];
  if (!mdText) { showToast('Nothing to export', 'error'); return; }

  function doGenerate() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      showToast('PDF library not ready, please retry', 'error');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210, M = 18, cW = pageW - M * 2, footerY = 284;

    function header() {
      doc.setFillColor(26, 95, 191);
      doc.rect(0, 0, pageW, 16, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10); doc.setFont('helvetica', 'bold');
      doc.text('SORA — Medical AI · Alexandria National University', M, 10.5);
      doc.setFontSize(8); doc.setFont('helvetica', 'normal');
      doc.text(new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' }),
               pageW - M, 10.5, { align: 'right' });
    }

    header();
    let y = 26;

    function pageBreak(needed) {
      if (y + needed > footerY - 4) {
        doc.addPage(); header(); y = 26;
      }
    }

    const lines = mdText.split('\n');
    for (const raw of lines) {
      const line = raw.trimEnd();

      if (!line.trim()) { y += 3; continue; }

      // H1
      if (/^#\s/.test(line)) {
        const t = line.replace(/^#\s+/, '').replace(/\*\*/g, '');
        pageBreak(16);
        doc.setTextColor(26, 95, 191); doc.setFontSize(16); doc.setFont('helvetica', 'bold');
        const w = doc.splitTextToSize(t, cW);
        doc.text(w, M, y); y += w.length * 9 + 2;
        doc.setDrawColor(61, 142, 232); doc.setLineWidth(0.8);
        doc.line(M, y, M + cW, y); y += 5;
        continue;
      }
      // H2
      if (/^##\s/.test(line)) {
        const t = line.replace(/^##\s+/, '').replace(/\*\*/g, '');
        pageBreak(13);
        doc.setTextColor(26, 95, 191); doc.setFontSize(13); doc.setFont('helvetica', 'bold');
        const w = doc.splitTextToSize(t, cW);
        doc.text(w, M, y); y += w.length * 7 + 2;
        doc.setDrawColor(180, 217, 255); doc.setLineWidth(0.4);
        doc.line(M, y, M + cW, y); y += 4;
        continue;
      }
      // H3
      if (/^###\s/.test(line)) {
        const t = line.replace(/^###\s+/, '').replace(/\*\*/g, '');
        pageBreak(12);
        doc.setFillColor(240, 247, 255);
        doc.rect(M - 2, y - 4, cW + 4, 9, 'F');
        doc.setDrawColor(61, 142, 232); doc.setLineWidth(0.35);
        doc.line(M - 2, y - 4, M - 2, y + 5);
        doc.setTextColor(26, 95, 191); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
        const w = doc.splitTextToSize(t, cW - 3);
        doc.text(w, M + 2, y); y += w.length * 6 + 4;
        continue;
      }
      // H4
      if (/^####\s/.test(line)) {
        const t = line.replace(/^####\s+/, '').replace(/\*\*/g, '');
        pageBreak(10);
        doc.setTextColor(30, 60, 100); doc.setFontSize(10.5); doc.setFont('helvetica', 'bold');
        const w = doc.splitTextToSize(t, cW);
        doc.text(w, M, y); y += w.length * 6 + 2;
        continue;
      }
      // HR
      if (/^---+$/.test(line.trim())) {
        doc.setDrawColor(180, 217, 255); doc.setLineWidth(0.3);
        doc.line(M, y, M + cW, y); y += 4;
        continue;
      }
      // Bullets / numbered
      if (/^[-•*]\s+/.test(line) || /^\d+\.\s+/.test(line)) {
        const t = line.replace(/^[-•*]\s+/, '').replace(/^\d+\.\s+/, '')
                      .replace(/\*\*/g, '').replace(/\*([^*]+)\*/g, '$1');
        doc.setTextColor(44, 62, 80); doc.setFontSize(10); doc.setFont('helvetica', 'normal');
        const w = doc.splitTextToSize(t, cW - 6);
        pageBreak(w.length * 5.5 + 2);
        doc.setFillColor(61, 142, 232);
        doc.circle(M + 1.5, y - 1.2, 1, 'F');
        doc.text(w, M + 5, y); y += w.length * 5.5 + 1.5;
        continue;
      }
      // Normal text
      const clean = line.replace(/\*\*([^*]+)\*\*/g, '$1')
                        .replace(/\*([^*]+)\*/g, '$1')
                        .replace(/`([^`]+)`/g, '$1');
      doc.setTextColor(44, 62, 80); doc.setFontSize(10); doc.setFont('helvetica', 'normal');
      const w = doc.splitTextToSize(clean, cW);
      pageBreak(w.length * 5.5 + 2);
      doc.text(w, M, y); y += w.length * 5.5 + 2;
    }

    // Footers
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      doc.setDrawColor(180, 217, 255); doc.setLineWidth(0.3);
      doc.line(M, footerY, pageW - M, footerY);
      doc.setTextColor(139, 163, 191); doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
      doc.text('SORA Medical AI · Alexandria National University', M, footerY + 4.5);
      doc.text(`Page ${i} of ${total}`, pageW - M, footerY + 4.5, { align: 'right' });
    }

    const slug = mdText.substring(0, 50)
      .replace(/[#*\n]/g, '').trim()
      .replace(/[^a-zA-Z0-9 ]/g, '').trim()
      .replace(/\s+/g, '_') || 'SORA_export';
    doc.save(`${slug}.pdf`);
    showToast('PDF saved ✦', 'success');
  }

  if (!window.jspdf || !window.jspdf.jsPDF) {
    showToast('Preparing PDF…', '');
    let attempts = 0;
    const check = setInterval(() => {
      if (window.jspdf && window.jspdf.jsPDF) { clearInterval(check); doGenerate(); }
      else if (++attempts > 30) { clearInterval(check); showToast('PDF library unavailable — try refreshing', 'error'); }
    }, 200);
  } else {
    doGenerate();
  }
};

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
window.showToast = function (msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
};

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
